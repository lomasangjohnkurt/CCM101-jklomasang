
services:
  db:
    image: mariadb:lts
    container_name: cloudnova-db
    restart: unless-stopped
    command: --transaction-isolation=READ-COMMITTED
    environment:
      MYSQL_ROOT_PASSWORD: ChangeRootPassword123!
      MYSQL_DATABASE: nextcloud
      MYSQL_USER: nextcloud
      MYSQL_PASSWORD: ChangeDBPassword123!
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - cloudnova-network

  app:
    image: nextcloud:apache
    container_name: cloudnova-app
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - db
    environment:
      MYSQL_DATABASE: nextcloud
      MYSQL_USER: nextcloud
      MYSQL_PASSWORD: ChangeDBPassword123!
      MYSQL_HOST: db
      NEXTCLOUD_ADMIN_USER: cloudadmin
      NEXTCLOUD_ADMIN_PASSWORD: ChangeAdminPassword123!
    volumes:
      - nextcloud_data:/var/www/html
    networks:
      - cloudnova-network

volumes:
  db_data:
  nextcloud_data:

networks:
  cloudnova-network:
    driver: bridge
